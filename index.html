<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reino Entre Luas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05020c;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #orientation-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #090514, #130a25);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #b39ddb;
            text-align: center;
            padding: 20px;
        }
        #orientation-screen h2 {
            font-size: 24px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #7b1fa2;
        }
        #orientation-screen p {
            font-size: 16px;
            color: #8e82a3;
        }
        .phone-icon {
            width: 50px;
            height: 80px;
            border: 3px solid #b39ddb;
            border-radius: 6px;
            margin-bottom: 20px;
            animation: rotatePhone 2s ease-in-out infinite;
            position: relative;
        }
        .phone-icon::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #b39ddb;
        }
        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }
        @media (min-width: 480px) and (orientation: landscape) {
            #orientation-screen { display: none !important; }
        }
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: #e1bee7;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 2px 2px #000;
        }
        .hearts { color: #ff1744; }
        .instructions {
            background: rgba(13, 6, 28, 0.7);
            border: 1px solid #4a148c;
            padding: 8px 12px;
            border-radius: 4px;
            align-self: center;
            color: #ce93d8;
            font-size: 12px;
            text-align: center;
            text-shadow: 1px 1px #000;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
        #controls-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px 20px 40px;
            pointer-events: none;
        }
        .joystick-zone {
            width: 100px;
            height: 100px;
            background: rgba(33, 13, 61, 0.4);
            border: 2px solid #7b1fa2;
            border-radius: 50%;
            position: relative;
            pointer-events: auto;
        }
        #joystick-stick {
            width: 40px;
            height: 40px;
            background: #9c27b0;
            border: 2px solid #e1bee7;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(156, 39, 176, 0.6);
        }
        .buttons-zone {
            display: grid;
            grid-template-columns: repeat(2, auto);
            gap: 12px;
            pointer-events: auto;
        }
        .btn-virtual {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #4a148c, #311b92);
            border: 2px solid #b39ddb;
            border-radius: 50%;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px #1a0933, 0 0 8px rgba(123, 31, 162, 0.5);
        }
        .btn-virtual:active {
            transform: scale(0.92);
            background: #7b1fa2;
            box-shadow: 0 1px #1a0933;
        }
        #btn-atk { grid-column: 2; grid-row: 1; width: 58px; height: 58px; font-size: 13px; background: linear-gradient(135deg, #880e4f, #4a148c); border-color: #ff4081; }
        #btn-use { grid-column: 1; grid-row: 1; }
        #btn-run { grid-column: 2; grid-row: 2; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="orientation-screen">
        <div class="phone-icon"></div>
        <h2>Gire o Dispositivo</h2>
        <p>Por favor, deite o seu iPhone na horizontal para entrar no Reino.</p>
    </div>

    <div id="canvas-container"></div>

    <div id="hud">
        <div class="hud-top">
            <div>REINO ENTRE LUAS</div>
            <div class="hearts">VIDA: ♥ ♥ ♥</div>
            <div>ESSÊNCIA: <span id="essence-count">0</span></div>
        </div>
        <div class="instructions" id="game-prompt">A névoa sussurra seu nome. Encontre o altar entre as ruínas.</div>
        <div></div>
    </div>

    <div id="controls-layer">
        <div class="joystick-zone" id="joystick-bounds">
            <div id="joystick-stick"></div>
        </div>
        <div class="buttons-zone">
            <div class="btn-virtual" id="btn-use">USAR</div>
            <div class="btn-virtual" id="btn-run">RUN</div>
            <div class="btn-virtual" id="btn-atk">ATK</div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        scene.background = new THREE.Color(0x06030c);
        scene.fog = new THREE.FogExp2(0x06030c, 0.08);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0x1a0f30, 1.2);
        scene.add(ambientLight);

        const moonLight = new THREE.DirectionalLight(0x7b1fa2, 1.5);
        moonLight.position.set(10, 20, 10);
        moonLight.castShadow = true;
        scene.add(moonLight);

        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x110b1e, roughness: 0.9 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const playerGroup = new THREE.Group();
        
        const bodyGeo = new THREE.ConeGeometry(0.5, 1.6, 6);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a0e17, roughness: 0.7 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.position.y = 0.8;
        body.castShadow = true;
        playerGroup.add(body);

        const hoodGeo = new THREE.SphereGeometry(0.35, 6, 6);
        const hoodMat = new THREE.MeshStandardMaterial({ color: 0x1a0d1a, roughness: 0.8 });
        const hood = new THREE.Mesh(hoodGeo, hoodMat);
        hood.position.y = 1.6;
        playerGroup.add(hood);

        const swordGroup = new THREE.Group();
        const bladeGeo = new THREE.BoxGeometry(0.08, 0.9, 0.03);
        const bladeMat = new THREE.MeshStandardMaterial({ color: 0x888899, metalness: 0.8 });
        const blade = new THREE.Mesh(bladeGeo, bladeMat);
        blade.position.y = 0.45;
        swordGroup.add(blade);
        
        swordGroup.position.set(0.5, 0.8, 0.3);
        swordGroup.rotation.x = Math.PI / 4;
        playerGroup.add(swordGroup);

        playerGroup.position.set(0, 0, 5);
        scene.add(playerGroup);

        const altarGroup = new THREE.Group();
        const baseGeo = new THREE.CylinderGeometry(1.5, 1.8, 0.6, 8);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x261c38, roughness: 0.9 });
        const altarBase = new THREE.Mesh(baseGeo, baseMat);
        altarBase.position.y = 0.3;
        altarBase.receiveShadow = true;
        altarBase.castShadow = true;
        altarGroup.add(altarBase);

        const crystalGeo = new THREE.OctahedronGeometry(0.4, 0);
        const crystalMat = new THREE.MeshBasicMaterial({ color: 0xcc66ff, wireframe: false });
        const crystal = new THREE.Mesh(crystalGeo, crystalMat);
        crystal.position.y = 1.4;
        altarGroup.add(crystal);

        const crystalLight = new THREE.PointLight(0x9c27b0, 3, 8);
        crystalLight.position.y = 1.4;
        altarGroup.add(crystalLight);

        altarGroup.position.set(0, 0, 0);
        scene.add(altarGroup);

        for (let i = 0; i < 6; i++) {
            const pillarGeo = new THREE.CylinderGeometry(0.3, 0.35, 3, 5);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x1d142b });
            const pillar = new THREE.Mesh(pillarGeo, pillarMat);
            const angle = (i / 6) * Math.PI * 2;
            pillar.position.set(Math.cos(angle) * 8, 1.5, Math.sin(angle) * 8);
            pillar.castShadow = true;
            pillar.receiveShadow = true;
            scene.add(pillar);
        }

        const moveInput = { x: 0, y: 0 };
        let isRunning = false;
        let isAttacking = false;
        let attackTimer = 0;
        let essenceCollected = false;

        const joystickBounds = document.getElementById('joystick-bounds');
        const joystickStick = document.getElementById('joystick-stick');
        let joystickActive = false;
        let joystickStart = { x: 0, y: 0 };

        function handleJoystickStart(e) {
            joystickActive = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = joystickBounds.getBoundingClientRect();
            joystickStart = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        function handleJoystickMove(e) {
            if (!joystickActive) return;
            const touch = e.touches ? e.touches[0] : e;
            
            let deltaX = touch.clientX - joystickStart.x;
            let deltaY = touch.clientY - joystickStart.y;
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            const maxDistance = 40;

            if (distance > maxDistance) {
                deltaX = (deltaX / distance) * maxDistance;
                deltaY = (deltaY / distance) * maxDistance;
            }

            joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

            moveInput.x = deltaX / maxDistance;
            moveInput.y = deltaY / maxDistance;
        }

        function handleJoystickEnd() {
            joystickActive = false;
            joystickStick.style.transform = 'translate(-50%, -50%)';
            moveInput.x = 0;
            moveInput.y = 0;
        }

        joystickBounds.addEventListener('touchstart', handleJoystickStart, { passive: true });
        window.addEventListener('touchmove', handleJoystickMove, { passive: false });
        window.addEventListener('touchend', handleJoystickEnd);

        document.getElementById('btn-run').addEventListener('touchstart', () => { isRunning = true; });
        document.getElementById('btn-run').addEventListener('touchend', () => { isRunning = false; });
        
        document.getElementById('btn-atk').addEventListener('touchstart', () => { triggerAttack(); });
        document.getElementById('btn-use').addEventListener('touchstart', () => { triggerInteract(); });

        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.code] = true; if(e.code === 'Space') triggerAttack(); if(e.code === 'KeyE') triggerInteract(); });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        function updateKeyboardInput() {
            if (joystickActive) return;
            moveInput.x = 0;
            moveInput.y = 0;
            if (keys['KeyA'] || keys['ArrowLeft']) moveInput.x = -1;
            if (keys['KeyD'] || keys['ArrowRight']) moveInput.x = 1;
            if (keys['KeyW'] || keys['ArrowUp']) moveInput.y = -1;
            if (keys['KeyS'] || keys['ArrowDown']) moveInput.y = 1;
            isRunning = keys['ShiftLeft'] || keys['ShiftRight'];
        }

        function triggerAttack() {
            if (isAttacking) return;
            isAttacking = true;
            attackTimer = 0;
        }

        function triggerInteract() {
            const dist = playerGroup.position.distanceTo(altarGroup.position);
            if (dist < 2.2 && !essenceCollected) {
                essenceCollected = true;
                document.getElementById('essence-count').innerText = "1";
                document.getElementById('game-prompt').innerText = "Você absorveu a Essência da Lua! As ruínas silenciam.";
                crystal.visible = false;
                crystalLight.visible = false;
            }
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            updateKeyboardInput();

            if (crystal.visible) {
                crystal.rotation.y += 1.2 * delta;
                crystal.position.y = 1.4 + Math.sin(clock.getElapsedTime() * 2) * 0.1;
            }

            const speed = isRunning ? 5.5 : 2.8;
            if (moveInput.x !== 0 || moveInput.y !== 0) {
                const moveVector = new THREE.Vector3(moveInput.x, 0, moveInput.y).normalize();
                playerGroup.position.addScaledVector(moveVector, speed * delta);
                
                const targetAngle = Math.atan2(moveInput.x, moveInput.y);
                playerGroup.rotation.y = targetAngle;
            }

            if (isAttacking) {
                attackTimer += delta * 8;
                swordGroup.rotation.z = Math.sin(attackTimer) * -2;
                if (attackTimer > Math.PI) {
                    isAttacking = false;
                    swordGroup.rotation.z = 0;
                }
            }

            const targetCamPos = new THREE.Vector3(
                playerGroup.position.x,
                playerGroup.position.y + 4.5,
                playerGroup.position.z + 6.5
            );
            camera.position.lerp(targetCamPos, 0.1);
            camera.lookAt(new THREE.Vector3(playerGroup.position.x, playerGroup.position.y + 0.5, playerGroup.position.z));

            renderer.render(scene, camera);
        }

        function handleResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }

        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', () => {
            setTimeout(handleResize, 300);
        });

        animate();
    </script>
</body>
</html>
